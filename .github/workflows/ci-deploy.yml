name: CI Deploy

# Opaque deploy for Backend runtime fs-A1-d3e4-k9 (fe4b → k9).
#
# Deployment architecture:
# - No container registry
# - GitHub Actions builds Docker image
# - Image is exported as .tar.gz
# - Image archive is uploaded as a GitHub artifact
# - GitHub Actions SCPs the archive directly to AWS
# - AWS docker load imports the image
# - PostgreSQL migrations run BEFORE replacing the application container
# - goose up runs on EVERY deployment
# - No rollback / restore-on-failure
# - PostgreSQL container and volume are never modified by deployment
# - Backend does not publish a host port
#
# Migration flow:
#   package migrations
#        ↓
#   goose status
#        ↓
#   goose up
#        ↓
#   goose status
#        ↓
#   assert zero pending migrations
#        ↓
#   deploy new k9 container
#
# IMPORTANT:
# Migrations must be backward-compatible with the currently running
# application because migrations execute before the old container is replaced.

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

# Prevent two production deployments from running at the same time.
# This is especially important because migrations modify shared PostgreSQL state.
concurrency:
  group: fs-A1-d3e4-production
  cancel-in-progress: false

env:
  # Docker image repositories must be lowercase.
  IMAGE_NAME: fs-a1-d3e4-k9

  # Container name keeps opaque casing.
  CONTAINER_NAME: fs-A1-d3e4-k9

  NETWORK_NAME: fs-A1-d3e4-n2

  DEPLOY_USER_EXPECTED: fs-A1-d3e4-u4

  OPT_ROOT: /opt/fs-A1-d3e4

  IMAGE_DIR: /opt/fs-A1-d3e4/k9/images

  ENV_FILE: /opt/fs-A1-d3e4/config/k9.env

  GOOSE_VERSION: v3.24.1

  MIGRATIONS_ARCHIVE_PREFIX: fs-a1-d3e4-k9-migrations


jobs:

  # ============================================================
  # 1. CHECKS
  # ============================================================
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: |
          set -euo pipefail
          go vet ./...

      - name: Test
        run: |
          set -euo pipefail
          go test ./...

      - name: Compile
        run: |
          set -euo pipefail
          go build -o /dev/null ./cmd/server


  # ============================================================
  # 2. BUILD
  # ============================================================
  build:
    name: Build
    needs: checks
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          set -euo pipefail

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o /tmp/server \
            ./cmd/server


  # ============================================================
  # 3. CREATE DOCKER IMAGE
  # ============================================================
  create-docker-image:
    name: Create Docker Image
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_NAME }}-${{ github.sha }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gzip Docker image archive
        run: |
          set -euo pipefail

          gzip -f \
            "/tmp/${{ env.IMAGE_NAME }}-${{ github.sha }}.tar"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.sha }}
          path: /tmp/${{ env.IMAGE_NAME }}-${{ github.sha }}.tar.gz
          retention-days: 1

      # Package migrations from the SAME Git SHA as the Docker image.
      # Migration artifacts therefore always correspond to this deployment.
      - name: Package migration archive
        run: |
          set -euo pipefail

          if [ ! -d "db/migrations" ]; then
            echo "ERROR: db/migrations directory does not exist."
            exit 1
          fi

          ARCHIVE="/tmp/${{ env.MIGRATIONS_ARCHIVE_PREFIX }}-${{ github.sha }}.tar.gz"

          tar \
            -czf "${ARCHIVE}" \
            -C db \
            migrations

          echo "Migration archive created:"
          ls -lh "${ARCHIVE}"

      - name: Upload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MIGRATIONS_ARCHIVE_PREFIX }}-${{ github.sha }}
          path: /tmp/${{ env.MIGRATIONS_ARCHIVE_PREFIX }}-${{ github.sha }}.tar.gz
          retention-days: 1


  # ============================================================
  # 4. SSH ACCESS
  # ============================================================
  ssh-access:
    name: SSH Access
    needs: create-docker-image
    runs-on: ubuntu-latest

    steps:

      - name: Validate secrets present
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.FS_A1_D3E4_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FS_A1_D3E4_SSH_KNOWN_HOSTS }}

        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOST}" ]; then
            echo "ERROR: FS_A1_D3E4_DEPLOY_HOST is not configured."
            exit 1
          fi

          if [ -z "${DEPLOY_USER}" ]; then
            echo "ERROR: FS_A1_D3E4_DEPLOY_USER is not configured."
            exit 1
          fi

          if [ "${DEPLOY_USER}" != "${DEPLOY_USER_EXPECTED}" ]; then
            echo "ERROR: Invalid deployment user."
            echo "Expected: ${DEPLOY_USER_EXPECTED}"
            exit 1
          fi

          if [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "ERROR: FS_A1_D3E4_DEPLOY_SSH_KEY is not configured."
            exit 1
          fi

          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "ERROR: FS_A1_D3E4_SSH_KNOWN_HOSTS is not configured."
            exit 1
          fi

          echo "GitHub deployment secrets validated."


      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.FS_A1_D3E4_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FS_A1_D3E4_SSH_KNOWN_HOSTS }}

        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${DEPLOY_SSH_KEY}" \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "${SSH_KNOWN_HOSTS}" \
            > ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      - name: Verify deployment target
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}

        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "OPT_ROOT='${OPT_ROOT}' IMAGE_DIR='${IMAGE_DIR}' ENV_FILE='${ENV_FILE}' NETWORK_NAME='${NETWORK_NAME}' CONTAINER_NAME='${CONTAINER_NAME}' DEPLOY_USER_EXPECTED='${DEPLOY_USER_EXPECTED}' bash -s" <<'REMOTE_CHECK'

          set -euo pipefail

          echo "Checking deployment target..."

          CURRENT_USER="$(id -un)"

          if [ "${CURRENT_USER}" != "${DEPLOY_USER_EXPECTED}" ]; then
            echo "ERROR: Wrong remote user."
            echo "Expected: ${DEPLOY_USER_EXPECTED}"
            echo "Actual: ${CURRENT_USER}"
            exit 1
          fi

          if [ "$(id -u)" = "0" ] || [ "${CURRENT_USER}" = "root" ]; then
            echo "ERROR: Deployment must never run as root."
            exit 1
          fi

          if [ ! -d "${OPT_ROOT}" ]; then
            echo "ERROR: Missing directory ${OPT_ROOT}"
            exit 1
          fi

          if [ ! -d "${IMAGE_DIR}" ]; then
            echo "ERROR: Missing directory ${IMAGE_DIR}"
            exit 1
          fi

          if [ ! -f "${ENV_FILE}" ]; then
            echo "ERROR: Missing env file ${ENV_FILE}"
            exit 1
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo "ERROR: Docker is not installed."
            exit 1
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "ERROR: Deployment user cannot access Docker."
            exit 1
          fi

          if ! docker network inspect "${NETWORK_NAME}" >/dev/null 2>&1; then
            echo "ERROR: Required network ${NETWORK_NAME} does not exist."
            exit 1
          fi

          # These workloads are protected.
          for name in \
            fs-worker \
            trino \
            ollama \
            fs-A1-d3e4-x7 \
            fs-A1-d3e4-p5
          do
            if docker ps -a \
              --format '{{.Names}}' \
              | grep -Fixq "${name}"
            then
              echo "Protected/sibling container detected (will not modify): ${name}"
            fi
          done

          if [ "${CONTAINER_NAME}" != "fs-A1-d3e4-k9" ]; then
            echo "ERROR: Invalid container name constant."
            exit 1
          fi

          case "${CONTAINER_NAME}" in
            fs-worker|trino|ollama|fs-A1-d3e4-x7|fs-A1-d3e4-p5)
              echo "ERROR: Attempt to target a protected container."
              exit 1
              ;;
          esac

          echo "Deployment target validated successfully."

          REMOTE_CHECK


  # ============================================================
  # 5. DEPLOYMENT
  #
  # Migration is intentionally inside this job so the workflow
  # remains:
  #
  # Checks
  # Build
  # Create Docker Image
  # SSH Access
  # Deployment
  #
  # Inside Deployment:
  #   Download artifacts
  #   Validate migrations
  #   goose status
  #   goose up
  #   goose status
  #   Assert clean
  #   Deploy k9
  # ============================================================
  deployment:
    name: Deployment
    needs: ssh-access
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Download Docker image
      # --------------------------------------------------------
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.sha }}
          path: /tmp


      # --------------------------------------------------------
      # Download migrations
      # --------------------------------------------------------
      - name: Download migration artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MIGRATIONS_ARCHIVE_PREFIX }}-${{ github.sha }}
          path: /tmp


      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.FS_A1_D3E4_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FS_A1_D3E4_SSH_KNOWN_HOSTS }}

        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${DEPLOY_SSH_KEY}" \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "${SSH_KNOWN_HOSTS}" \
            > ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      # --------------------------------------------------------
      # Download goose
      # --------------------------------------------------------
      - name: Download goose
        run: |
          set -euo pipefail

          mkdir -p /tmp/goose-tools

          curl -fsSL \
            -o /tmp/goose-tools/goose \
            "https://github.com/pressly/goose/releases/download/${GOOSE_VERSION}/goose_linux_x86_64"

          chmod 755 /tmp/goose-tools/goose

          /tmp/goose-tools/goose -version


      # --------------------------------------------------------
      # Copy Docker image + migrations + goose to server
      # --------------------------------------------------------
      - name: Copy deployment artifacts to server
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}

        run: |
          set -euo pipefail

          IMAGE_ARCHIVE="/tmp/${IMAGE_NAME}-${{ github.sha }}.tar.gz"

          MIGRATION_ARCHIVE="/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${{ github.sha }}.tar.gz"

          if [ ! -f "${IMAGE_ARCHIVE}" ]; then
            echo "ERROR: Docker image archive not found:"
            echo "${IMAGE_ARCHIVE}"
            exit 1
          fi

          if [ ! -f "${MIGRATION_ARCHIVE}" ]; then
            echo "ERROR: Migration archive not found:"
            echo "${MIGRATION_ARCHIVE}"
            exit 1
          fi

          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${IMAGE_ARCHIVE}" \
            "${MIGRATION_ARCHIVE}" \
            /tmp/goose-tools/goose \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"


      # ========================================================
      # MIGRATION PHASE
      # ========================================================

      - name: Validate and apply database migrations
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}
          VERSION: ${{ github.sha }}

        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "VERSION='${VERSION}' \
             NETWORK_NAME='${NETWORK_NAME}' \
             ENV_FILE='${ENV_FILE}' \
             DEPLOY_USER_EXPECTED='${DEPLOY_USER_EXPECTED}' \
             MIGRATIONS_ARCHIVE_PREFIX='${MIGRATIONS_ARCHIVE_PREFIX}' \
             bash -s" <<'REMOTE_MIGRATE'

          set -euo pipefail

          echo "=================================================="
          echo "DATABASE MIGRATION PHASE"
          echo "=================================================="

          # ----------------------------------------------------
          # 1. Validate deployment user
          # ----------------------------------------------------

          if [ "$(id -un)" != "${DEPLOY_USER_EXPECTED}" ]; then
            echo "ERROR: Invalid deployment user."
            exit 1
          fi

          if [ "$(id -u)" = "0" ]; then
            echo "ERROR: Migration must never run as root."
            exit 1
          fi


          # ----------------------------------------------------
          # 2. Validate required files/network
          # ----------------------------------------------------

          if [ ! -f "${ENV_FILE}" ]; then
            echo "ERROR: Missing ${ENV_FILE}"
            exit 1
          fi

          if ! docker network inspect "${NETWORK_NAME}" >/dev/null 2>&1; then
            echo "ERROR: Network ${NETWORK_NAME} does not exist."
            exit 1
          fi


          ARCHIVE="/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}.tar.gz"

          GOOSE_BIN="/tmp/goose"

          MIGRATE_DIR="/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}"


          if [ ! -f "${ARCHIVE}" ]; then
            echo "ERROR: Migration archive missing:"
            echo "${ARCHIVE}"
            exit 1
          fi

          if [ ! -x "${GOOSE_BIN}" ]; then
            echo "ERROR: Goose binary missing:"
            echo "${GOOSE_BIN}"
            exit 1
          fi


          # ----------------------------------------------------
          # 3. Extract migration files
          # ----------------------------------------------------

          rm -rf "${MIGRATE_DIR}"

          mkdir -p "${MIGRATE_DIR}"

          tar \
            -xzf "${ARCHIVE}" \
            -C "${MIGRATE_DIR}"


          if [ ! -d "${MIGRATE_DIR}/migrations" ]; then
            echo "ERROR: Migration archive does not contain migrations/."
            exit 1
          fi


          echo "Migration files:"
          find "${MIGRATE_DIR}/migrations" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


          # ----------------------------------------------------
          # 4. Read DATABASE_URL
          # ----------------------------------------------------

          DATABASE_URL="$(
            grep -E '^DATABASE_URL=' \
              "${ENV_FILE}" \
              | head -n1 \
              | cut -d= -f2-
          )"

          DATABASE_URL="${DATABASE_URL#\"}"
          DATABASE_URL="${DATABASE_URL%\"}"
          DATABASE_URL="${DATABASE_URL#\'}"
          DATABASE_URL="${DATABASE_URL%\'}"


          if [ -z "${DATABASE_URL}" ]; then
            echo "ERROR: DATABASE_URL missing from ${ENV_FILE}."
            exit 1
          fi

          export DATABASE_URL



          # ----------------------------------------------------
          # 5. Migration status BEFORE
          # ----------------------------------------------------

          echo ""
          echo "=== goose status BEFORE ==="

          docker run \
            --rm \
            --network "${NETWORK_NAME}" \
            -e DATABASE_URL \
            -v "${MIGRATE_DIR}/migrations:/migrations:ro" \
            -v "${GOOSE_BIN}:/goose:ro" \
            --entrypoint /goose \
            debian:bookworm-slim \
            -dir /migrations \
            postgres \
            "${DATABASE_URL}" \
            status


          # ----------------------------------------------------
          # 6. ALWAYS run goose up
          #
          # This is intentional.
          #
          # We do NOT check whether migration files changed.
          #
          # If no migrations are pending:
          #     goose up -> nothing to do
          #
          # If migrations are pending:
          #     goose up -> applies them
          #
          # If DB is empty:
          #     goose up -> applies the complete migration chain
          # ----------------------------------------------------

          echo ""
          echo "=== goose up ==="

          docker run \
            --rm \
            --network "${NETWORK_NAME}" \
            -e DATABASE_URL \
            -v "${MIGRATE_DIR}/migrations:/migrations:ro" \
            -v "${GOOSE_BIN}:/goose:ro" \
            --entrypoint /goose \
            debian:bookworm-slim \
            -dir /migrations \
            postgres \
            "${DATABASE_URL}" \
            up


          echo ""
          echo "goose up completed successfully."


          # ----------------------------------------------------
          # 7. Migration status AFTER
          # ----------------------------------------------------

          echo ""
          echo "=== goose status AFTER ==="

          STATUS_OUTPUT="$(
            docker run \
              --rm \
              --network "${NETWORK_NAME}" \
              -e DATABASE_URL \
              -v "${MIGRATE_DIR}/migrations:/migrations:ro" \
              -v "${GOOSE_BIN}:/goose:ro" \
              --entrypoint /goose \
              debian:bookworm-slim \
              -dir /migrations \
              postgres \
              "${DATABASE_URL}" \
              status \
              2>&1
          )"

          STATUS_RC=$?

          echo "${STATUS_OUTPUT}"

          if [ "${STATUS_RC}" -ne 0 ]; then
            echo "ERROR: goose status after migration failed."
            exit 1
          fi


          # ----------------------------------------------------
          # 8. Assert zero pending migrations
          # ----------------------------------------------------

          if echo "${STATUS_OUTPUT}" | grep -Eqi 'Pending'; then
            echo ""
            echo "ERROR: Pending migrations remain after goose up."
            echo "Deployment is BLOCKED."
            exit 1
          fi


          echo ""
          echo "=================================================="
          echo "DATABASE MIGRATION SUCCESS"
          echo "=================================================="
          echo "Zero pending migrations."
          echo "Only now can the application container be replaced."


          # ----------------------------------------------------
          # 9. Cleanup migration temporary files
          # ----------------------------------------------------

          rm -rf "${MIGRATE_DIR}"

          rm -f \
            "${ARCHIVE}" \
            "${GOOSE_BIN}"

          echo "Migration temporary files cleaned up."

          REMOTE_MIGRATE


      # ========================================================
      # APPLICATION DEPLOYMENT PHASE
      # ========================================================

      - name: Deploy application safely
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}
          VERSION: ${{ github.sha }}

        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "VERSION='${VERSION}' \
             IMAGE_NAME='${IMAGE_NAME}' \
             CONTAINER_NAME='${CONTAINER_NAME}' \
             NETWORK_NAME='${NETWORK_NAME}' \
             IMAGE_DIR='${IMAGE_DIR}' \
             ENV_FILE='${ENV_FILE}' \
             DEPLOY_USER_EXPECTED='${DEPLOY_USER_EXPECTED}' \
             bash -s" <<'REMOTE_DEPLOY'

          set -euo pipefail

          echo "=================================================="
          echo "APPLICATION DEPLOYMENT"
          echo "=================================================="


          # ----------------------------------------------------
          # 1. Validate deployment user
          # ----------------------------------------------------

          if [ "$(id -un)" != "${DEPLOY_USER_EXPECTED}" ]; then
            echo "ERROR: Invalid deployment user."
            exit 1
          fi

          if [ "$(id -u)" = "0" ]; then
            echo "ERROR: Deployment cannot run as root."
            exit 1
          fi


          # ----------------------------------------------------
          # 2. Validate exact image/container identity
          # ----------------------------------------------------

          if [ "${CONTAINER_NAME}" != "fs-A1-d3e4-k9" ]; then
            echo "ERROR: Invalid container name."
            exit 1
          fi

          if [ "${IMAGE_NAME}" != "fs-a1-d3e4-k9" ]; then
            echo "ERROR: Invalid image name."
            exit 1
          fi


          case "${CONTAINER_NAME}" in
            fs-worker|trino|ollama|fs-A1-d3e4-x7|fs-A1-d3e4-p5)
              echo "ERROR: Protected container."
              exit 1
              ;;
          esac


          # ----------------------------------------------------
          # 3. Validate Git SHA
          # ----------------------------------------------------

          if ! echo "${VERSION}" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "ERROR: Invalid Git SHA."
            exit 1
          fi


          # ----------------------------------------------------
          # 4. Validate Docker
          # ----------------------------------------------------

          if ! command -v docker >/dev/null 2>&1; then
            echo "ERROR: Docker unavailable."
            exit 1
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "ERROR: Deployment user cannot access Docker."
            exit 1
          fi


          # ----------------------------------------------------
          # 5. Validate network
          # ----------------------------------------------------

          if ! docker network inspect "${NETWORK_NAME}" >/dev/null 2>&1; then
            echo "ERROR: Network ${NETWORK_NAME} missing."
            exit 1
          fi


          # ----------------------------------------------------
          # 6. Validate environment
          # ----------------------------------------------------

          if [ ! -f "${ENV_FILE}" ]; then
            echo "ERROR: Missing ${ENV_FILE}"
            exit 1
          fi


          # ----------------------------------------------------
          # 7. Validate image archive
          # ----------------------------------------------------

          mkdir -p "${IMAGE_DIR}"

          STAGED="/tmp/${IMAGE_NAME}-${VERSION}.tar.gz"

          IMAGE_ARCHIVE="${IMAGE_DIR}/${IMAGE_NAME}-${VERSION}.tar.gz"

          TEMP_ARCHIVE="${IMAGE_ARCHIVE}.tmp"


          if [ ! -f "${STAGED}" ]; then
            echo "ERROR: Docker image archive not found:"
            echo "${STAGED}"
            exit 1
          fi


          # ----------------------------------------------------
          # 8. Move archive into permanent image storage
          # ----------------------------------------------------

          mv "${STAGED}" "${TEMP_ARCHIVE}"

          mv "${TEMP_ARCHIVE}" "${IMAGE_ARCHIVE}"


          # ----------------------------------------------------
          # 9. Load Docker image
          # ----------------------------------------------------

          echo "Loading Docker image..."

          gunzip -c "${IMAGE_ARCHIVE}" \
            | docker load


          # ----------------------------------------------------
          # 10. Verify loaded image
          # ----------------------------------------------------

          if ! docker image inspect \
            "${IMAGE_NAME}:${VERSION}" \
            >/dev/null 2>&1
          then
            echo "ERROR: Docker image failed verification."
            exit 1
          fi

          echo "Image verified:"
          echo "${IMAGE_NAME}:${VERSION}"


          # ----------------------------------------------------
          # 11. Inspect existing target container
          # ----------------------------------------------------

          if docker ps -aq \
            --filter "name=^${CONTAINER_NAME}$" \
            | grep -q .
          then

            EXISTING_IMAGE="$(
              docker inspect \
                --format '{{.Config.Image}}' \
                "${CONTAINER_NAME}"
            )"


            case "${EXISTING_IMAGE}" in

              "${IMAGE_NAME}:"*)
                echo "Existing container image identity OK:"
                echo "${EXISTING_IMAGE}"
                ;;

              *)
                echo "ERROR: Unexpected existing container image."
                echo "Expected prefix: ${IMAGE_NAME}:"
                echo "Actual: ${EXISTING_IMAGE}"
                echo ""
                echo "ABORT — will not replace unexpected container."
                exit 1
                ;;

            esac


            # --------------------------------------------------
            # 12. Stop current target container
            # --------------------------------------------------

            echo "Stopping ${CONTAINER_NAME}..."

            docker stop "${CONTAINER_NAME}" || true


            # --------------------------------------------------
            # 13. Remove current target container
            # --------------------------------------------------

            echo "Removing ${CONTAINER_NAME}..."

            docker rm "${CONTAINER_NAME}"

          fi


          # ----------------------------------------------------
          # 14. Start new application container
          # ----------------------------------------------------

          echo "Starting ${CONTAINER_NAME}..."

          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            --network "${NETWORK_NAME}" \
            --env-file "${ENV_FILE}" \
            "${IMAGE_NAME}:${VERSION}"


          # ----------------------------------------------------
          # 15. Give application time to start
          # ----------------------------------------------------

          sleep 5


          # ----------------------------------------------------
          # 16. Verify container is running
          # ----------------------------------------------------

          if ! docker ps \
            --filter "name=^${CONTAINER_NAME}$" \
            --format '{{.Names}}' \
            | grep -Fxq "${CONTAINER_NAME}"
          then

            echo "ERROR: New container failed to start."

            docker logs \
              --tail 100 \
              "${CONTAINER_NAME}" || true

            exit 1

          fi


          echo "New application container is running."


          # ----------------------------------------------------
          # 17. Retain latest five image archives
          # ----------------------------------------------------

          cd "${IMAGE_DIR}"

          ls -1t \
            "${IMAGE_NAME}"-*.tar.gz \
            2>/dev/null \
            | tail -n +6 \
            | while IFS= read -r old
          do
            rm -f -- "${old}"
          done


          # ----------------------------------------------------
          # 18. Final status
          # ----------------------------------------------------

          echo ""
          echo "=================================================="
          echo "DEPLOYMENT COMPLETED"
          echo "=================================================="

          docker ps \
            --filter "name=^${CONTAINER_NAME}$"

          REMOTE_DEPLOY