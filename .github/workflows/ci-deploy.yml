name: CI Deploy

# Opaque deploy for Backend runtime fs-A1-d3e4-k9 (fe4b → k9).
# - No container registry (artifact → SCP → docker load only)
# - No host port publish
# - No rollback / restore-on-failure
# - Does not create, stop, or remove PostgreSQL (fs-A1-d3e4-p5 / v8)
# - Migrate (goose) runs on the host over SSH before Deployment; blocks deploy if not clean

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Docker image repos must be lowercase; container name keeps opaque casing.
  IMAGE_NAME: fs-a1-d3e4-k9
  CONTAINER_NAME: fs-A1-d3e4-k9
  NETWORK_NAME: fs-A1-d3e4-n2
  DEPLOY_USER_EXPECTED: fs-A1-d3e4-u4
  OPT_ROOT: /opt/fs-A1-d3e4
  IMAGE_DIR: /opt/fs-A1-d3e4/k9/images
  ENV_FILE: /opt/fs-A1-d3e4/config/k9.env
  GOOSE_VERSION: v3.24.1
  MIGRATIONS_ARCHIVE_PREFIX: fs-a1-d3e4-k9-migrations

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Compile
        run: go build -o /dev/null ./cmd/server

  build:
    name: Build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -trimpath -ldflags="-s -w" -o /tmp/server ./cmd/server

  create-docker-image:
    name: Create Docker Image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_NAME }}-${{ github.sha }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gzip archive
        run: gzip -f "/tmp/${{ env.IMAGE_NAME }}-${{ github.sha }}.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.sha }}
          path: /tmp/${{ env.IMAGE_NAME }}-${{ github.sha }}.tar.gz
          retention-days: 1

  ssh-access:
    name: SSH Access
    needs: create-docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets present
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.FS_A1_D3E4_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FS_A1_D3E4_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "ERROR: FS_A1_D3E4_DEPLOY_HOST is not configured."
            exit 1
          fi
          if [ -z "${DEPLOY_USER}" ]; then
            echo "ERROR: FS_A1_D3E4_DEPLOY_USER is not configured."
            exit 1
          fi
          if [ "${DEPLOY_USER}" != "${DEPLOY_USER_EXPECTED}" ]; then
            echo "ERROR: Invalid deployment user."
            echo "Expected: ${DEPLOY_USER_EXPECTED}"
            exit 1
          fi
          if [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "ERROR: FS_A1_D3E4_DEPLOY_SSH_KEY is not configured."
            exit 1
          fi
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "ERROR: FS_A1_D3E4_SSH_KNOWN_HOSTS is not configured."
            exit 1
          fi
          echo "GitHub deployment secrets validated."

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.FS_A1_D3E4_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FS_A1_D3E4_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify deployment target
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "OPT_ROOT='${OPT_ROOT}' IMAGE_DIR='${IMAGE_DIR}' ENV_FILE='${ENV_FILE}' NETWORK_NAME='${NETWORK_NAME}' CONTAINER_NAME='${CONTAINER_NAME}' DEPLOY_USER_EXPECTED='${DEPLOY_USER_EXPECTED}' bash -s" <<'REMOTE_CHECK'
          set -euo pipefail

          echo "Checking deployment target..."

          CURRENT_USER="$(id -un)"
          if [ "${CURRENT_USER}" != "${DEPLOY_USER_EXPECTED}" ]; then
            echo "ERROR: Wrong remote user."
            echo "Expected: ${DEPLOY_USER_EXPECTED}"
            echo "Actual: ${CURRENT_USER}"
            exit 1
          fi
          if [ "$(id -u)" = "0" ] || [ "${CURRENT_USER}" = "root" ]; then
            echo "ERROR: Deployment must never run as root."
            exit 1
          fi

          if [ ! -d "${OPT_ROOT}" ]; then
            echo "ERROR: Missing directory ${OPT_ROOT}"
            exit 1
          fi
          if [ ! -d "${IMAGE_DIR}" ]; then
            echo "ERROR: Missing directory ${IMAGE_DIR}"
            exit 1
          fi
          if [ ! -f "${ENV_FILE}" ]; then
            echo "ERROR: Missing env file ${ENV_FILE}"
            exit 1
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo "ERROR: Docker is not installed."
            exit 1
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "ERROR: Deployment user cannot access Docker."
            exit 1
          fi

          if ! docker network inspect "${NETWORK_NAME}" >/dev/null 2>&1; then
            echo "ERROR: Required network ${NETWORK_NAME} does not exist."
            exit 1
          fi

          # Presence note only — never modify these workloads.
          for name in fs-worker trino ollama fs-A1-d3e4-x7 fs-A1-d3e4-p5; do
            if docker ps -a --format '{{.Names}}' | grep -Fixq "${name}"; then
              echo "Protected/sibling container detected (will not modify): ${name}"
            fi
          done

          if [ "${CONTAINER_NAME}" != "fs-A1-d3e4-k9" ]; then
            echo "ERROR: Invalid container name constant."
            exit 1
          fi

          case "${CONTAINER_NAME}" in
            fs-worker|trino|ollama|fs-A1-d3e4-x7|fs-A1-d3e4-p5)
              echo "ERROR: Attempt to target a protected container."
              exit 1
              ;;
          esac

          echo "Deployment target validated successfully."
          REMOTE_CHECK

  migrate:
    name: Migrate
    needs: ssh-access
    runs-on: ubuntu-latest
    outputs:
      migrations_changed: ${{ steps.detect.outputs.migrations_changed }}
    steps:
      - name: Checkout and package migrations
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package migrations archive
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/${{ env.MIGRATIONS_ARCHIVE_PREFIX }}-${{ github.sha }}.tar.gz"
          tar -czf "${ARCHIVE}" -C db migrations
          ls -la "${ARCHIVE}"

      - name: Detect migration file changes
        id: detect
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          FORCE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE=true
          fi
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            FORCE=true
          fi

          CHANGED=false
          if [ "${FORCE}" = "true" ]; then
            CHANGED=true
            echo "Treating migrations as changed (workflow_dispatch or missing before SHA)."
          elif git diff --name-only "${BEFORE}" "${SHA}" -- db/migrations/ | grep -q .; then
            CHANGED=true
            echo "Changed migration files:"
            git diff --name-only "${BEFORE}" "${SHA}" -- db/migrations/ || true
          else
            echo "No migration file changes in this push."
          fi

          if [ "${CHANGED}" = "true" ]; then
            echo "Migration files changed: yes"
            echo "migrations_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Migration files changed: no"
            echo "migrations_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download goose binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/goose-tools
          curl -fsSL \
            -o /tmp/goose-tools/goose \
            "https://github.com/pressly/goose/releases/download/${{ env.GOOSE_VERSION }}/goose_linux_x86_64"
          chmod 755 /tmp/goose-tools/goose
          /tmp/goose-tools/goose -version

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.FS_A1_D3E4_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FS_A1_D3E4_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy migrations to server
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/${{ env.MIGRATIONS_ARCHIVE_PREFIX }}-${{ github.sha }}.tar.gz"
          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${ARCHIVE}" \
            /tmp/goose-tools/goose \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"

      - name: Show migration status (before)
        id: status_before
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "VERSION='${VERSION}' NETWORK_NAME='${NETWORK_NAME}' ENV_FILE='${ENV_FILE}' DEPLOY_USER_EXPECTED='${DEPLOY_USER_EXPECTED}' MIGRATIONS_ARCHIVE_PREFIX='${MIGRATIONS_ARCHIVE_PREFIX}' bash -s" <<'REMOTE_STATUS_BEFORE'
          set -euo pipefail

          if [ "$(id -un)" != "${DEPLOY_USER_EXPECTED}" ] || [ "$(id -u)" = "0" ]; then
            echo "ERROR: Invalid deployment user."
            exit 1
          fi
          if [ ! -f "${ENV_FILE}" ]; then
            echo "ERROR: Missing ${ENV_FILE}"
            exit 1
          fi
          if ! docker network inspect "${NETWORK_NAME}" >/dev/null 2>&1; then
            echo "ERROR: Network ${NETWORK_NAME} missing."
            exit 1
          fi

          ARCHIVE="/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}.tar.gz"
          GOOSE_BIN="/tmp/goose"
          MIGRATE_DIR="/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}"
          STATUS_FILE="/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}-status-before.txt"

          if [ ! -f "${ARCHIVE}" ] || [ ! -x "${GOOSE_BIN}" ]; then
            echo "ERROR: Migrations archive or goose binary missing on server."
            exit 1
          fi

          rm -rf "${MIGRATE_DIR}"
          mkdir -p "${MIGRATE_DIR}"
          tar -xzf "${ARCHIVE}" -C "${MIGRATE_DIR}"
          if [ ! -d "${MIGRATE_DIR}/migrations" ]; then
            echo "ERROR: Archive did not contain migrations/."
            exit 1
          fi

          DATABASE_URL="$(grep -E '^DATABASE_URL=' "${ENV_FILE}" | head -n1 | cut -d= -f2-)"
          DATABASE_URL="${DATABASE_URL#\"}"
          DATABASE_URL="${DATABASE_URL%\"}"
          DATABASE_URL="${DATABASE_URL#\'}"
          DATABASE_URL="${DATABASE_URL%\'}"
          if [ -z "${DATABASE_URL}" ]; then
            echo "ERROR: DATABASE_URL missing from env file."
            exit 1
          fi
          export DATABASE_URL

          echo "=== goose status (before) ==="
          set +e
          docker run --rm \
            --network "${NETWORK_NAME}" \
            -e DATABASE_URL \
            -v "${MIGRATE_DIR}/migrations:/migrations:ro" \
            -v "${GOOSE_BIN}:/goose:ro" \
            --entrypoint /goose \
            debian:bookworm-slim \
            -dir /migrations postgres "${DATABASE_URL}" status \
            | tee "${STATUS_FILE}"
          STATUS_RC=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS_RC}" -ne 0 ]; then
            echo "ERROR: goose status (before) failed."
            exit 1
          fi

          if grep -Eqi '[[:space:]]Pending[[:space:]]' "${STATUS_FILE}"; then
            echo "has_pending=true" > "/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}-pending.flag"
            echo "Pending migrations detected."
          else
            echo "has_pending=false" > "/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}-pending.flag"
            echo "No pending migrations."
          fi
          REMOTE_STATUS_BEFORE

          HAS_PENDING="$(ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat /tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}-pending.flag")"
          echo "has_pending=${HAS_PENDING#has_pending=}" >> "${GITHUB_OUTPUT}"
          echo "Remote pending flag: ${HAS_PENDING}"

      - name: Apply migrations (goose up)
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}
          VERSION: ${{ github.sha }}
          MIGRATIONS_CHANGED: ${{ steps.detect.outputs.migrations_changed }}
          HAS_PENDING: ${{ steps.status_before.outputs.has_pending }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          RUN_UP=false
          if [ "${MIGRATIONS_CHANGED}" = "true" ] || [ "${HAS_PENDING}" = "true" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            RUN_UP=true
          fi

          if [ "${RUN_UP}" != "true" ]; then
            echo "No pending migrations; skipping goose up"
            exit 0
          fi

          echo "Running goose up (migrations_changed=${MIGRATIONS_CHANGED} has_pending=${HAS_PENDING} event=${EVENT_NAME})"
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "VERSION='${VERSION}' NETWORK_NAME='${NETWORK_NAME}' ENV_FILE='${ENV_FILE}' DEPLOY_USER_EXPECTED='${DEPLOY_USER_EXPECTED}' MIGRATIONS_ARCHIVE_PREFIX='${MIGRATIONS_ARCHIVE_PREFIX}' bash -s" <<'REMOTE_UP'
          set -euo pipefail

          if [ "$(id -un)" != "${DEPLOY_USER_EXPECTED}" ] || [ "$(id -u)" = "0" ]; then
            echo "ERROR: Invalid deployment user."
            exit 1
          fi

          MIGRATE_DIR="/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}"
          GOOSE_BIN="/tmp/goose"
          if [ ! -d "${MIGRATE_DIR}/migrations" ] || [ ! -x "${GOOSE_BIN}" ]; then
            echo "ERROR: Migrations or goose binary not prepared."
            exit 1
          fi

          DATABASE_URL="$(grep -E '^DATABASE_URL=' "${ENV_FILE}" | head -n1 | cut -d= -f2-)"
          DATABASE_URL="${DATABASE_URL#\"}"
          DATABASE_URL="${DATABASE_URL%\"}"
          DATABASE_URL="${DATABASE_URL#\'}"
          DATABASE_URL="${DATABASE_URL%\'}"
          if [ -z "${DATABASE_URL}" ]; then
            echo "ERROR: DATABASE_URL missing from env file."
            exit 1
          fi
          export DATABASE_URL

          echo "=== goose up ==="
          docker run --rm \
            --network "${NETWORK_NAME}" \
            -e DATABASE_URL \
            -v "${MIGRATE_DIR}/migrations:/migrations:ro" \
            -v "${GOOSE_BIN}:/goose:ro" \
            --entrypoint /goose \
            debian:bookworm-slim \
            -dir /migrations postgres "${DATABASE_URL}" up
          echo "goose up completed."
          REMOTE_UP

      - name: Show migration status (after)
        id: status_after
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "VERSION='${VERSION}' NETWORK_NAME='${NETWORK_NAME}' ENV_FILE='${ENV_FILE}' DEPLOY_USER_EXPECTED='${DEPLOY_USER_EXPECTED}' MIGRATIONS_ARCHIVE_PREFIX='${MIGRATIONS_ARCHIVE_PREFIX}' bash -s" <<'REMOTE_STATUS_AFTER'
          set -euo pipefail

          if [ "$(id -un)" != "${DEPLOY_USER_EXPECTED}" ] || [ "$(id -u)" = "0" ]; then
            echo "ERROR: Invalid deployment user."
            exit 1
          fi

          MIGRATE_DIR="/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}"
          GOOSE_BIN="/tmp/goose"
          STATUS_FILE="/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}-status-after.txt"

          DATABASE_URL="$(grep -E '^DATABASE_URL=' "${ENV_FILE}" | head -n1 | cut -d= -f2-)"
          DATABASE_URL="${DATABASE_URL#\"}"
          DATABASE_URL="${DATABASE_URL%\"}"
          DATABASE_URL="${DATABASE_URL#\'}"
          DATABASE_URL="${DATABASE_URL%\'}"
          if [ -z "${DATABASE_URL}" ]; then
            echo "ERROR: DATABASE_URL missing from env file."
            exit 1
          fi
          export DATABASE_URL

          echo "=== goose status (after) ==="
          set +e
          docker run --rm \
            --network "${NETWORK_NAME}" \
            -e DATABASE_URL \
            -v "${MIGRATE_DIR}/migrations:/migrations:ro" \
            -v "${GOOSE_BIN}:/goose:ro" \
            --entrypoint /goose \
            debian:bookworm-slim \
            -dir /migrations postgres "${DATABASE_URL}" status \
            | tee "${STATUS_FILE}"
          STATUS_RC=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS_RC}" -ne 0 ]; then
            echo "ERROR: goose status (after) failed."
            exit 1
          fi

          if grep -Eqi '[[:space:]]Pending[[:space:]]' "${STATUS_FILE}"; then
            echo "has_pending=true" > "/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}-pending-after.flag"
            echo "Pending migrations remain after apply."
          else
            echo "has_pending=false" > "/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}-pending-after.flag"
            echo "No pending migrations after apply."
          fi
          REMOTE_STATUS_AFTER

          HAS_PENDING="$(ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat /tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}-pending-after.flag")"
          echo "has_pending=${HAS_PENDING#has_pending=}" >> "${GITHUB_OUTPUT}"
          echo "Remote pending-after flag: ${HAS_PENDING}"

      - name: Assert clean
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}
          VERSION: ${{ github.sha }}
          HAS_PENDING_AFTER: ${{ steps.status_after.outputs.has_pending }}
        run: |
          set -euo pipefail
          if [ "${HAS_PENDING_AFTER}" != "false" ]; then
            echo "ERROR: Migration state is not clean (pending migrations remain)."
            echo "Deployment will not run. Fix the database, then re-run the workflow."
            exit 1
          fi
          echo "Migration assert clean: OK (zero pending)."

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "VERSION='${VERSION}' MIGRATIONS_ARCHIVE_PREFIX='${MIGRATIONS_ARCHIVE_PREFIX}' bash -s" <<'REMOTE_CLEANUP'
          set -euo pipefail
          rm -rf "/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}"
          rm -f \
            "/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}.tar.gz" \
            "/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}-status-before.txt" \
            "/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}-status-after.txt" \
            "/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}-pending.flag" \
            "/tmp/${MIGRATIONS_ARCHIVE_PREFIX}-${VERSION}-pending-after.flag" \
            "/tmp/goose"
          echo "Migration temp files cleaned up."
          REMOTE_CLEANUP

  deployment:
    name: Deployment
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.sha }}
          path: /tmp

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.FS_A1_D3E4_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FS_A1_D3E4_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy archive to server
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/${{ env.IMAGE_NAME }}-${{ github.sha }}.tar.gz"
          if [ ! -f "${ARCHIVE}" ]; then
            echo "ERROR: Local archive not found: ${ARCHIVE}"
            ls -la /tmp || true
            exit 1
          fi
          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${ARCHIVE}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"

      - name: Deploy safely
        env:
          DEPLOY_HOST: ${{ secrets.FS_A1_D3E4_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FS_A1_D3E4_DEPLOY_USER }}
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "VERSION='${VERSION}' IMAGE_NAME='${IMAGE_NAME}' CONTAINER_NAME='${CONTAINER_NAME}' NETWORK_NAME='${NETWORK_NAME}' IMAGE_DIR='${IMAGE_DIR}' ENV_FILE='${ENV_FILE}' DEPLOY_USER_EXPECTED='${DEPLOY_USER_EXPECTED}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          if [ "$(id -un)" != "${DEPLOY_USER_EXPECTED}" ]; then
            echo "ERROR: Invalid deployment user."
            exit 1
          fi
          if [ "$(id -u)" = "0" ]; then
            echo "ERROR: Deployment cannot run as root."
            exit 1
          fi

          if [ "${CONTAINER_NAME}" != "fs-A1-d3e4-k9" ] || [ "${IMAGE_NAME}" != "fs-a1-d3e4-k9" ]; then
            echo "ERROR: Invalid image/container identity."
            exit 1
          fi

          case "${CONTAINER_NAME}" in
            fs-worker|trino|ollama|fs-A1-d3e4-x7|fs-A1-d3e4-p5)
              echo "ERROR: Protected container."
              exit 1
              ;;
          esac

          if ! echo "${VERSION}" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "ERROR: Invalid Git SHA."
            exit 1
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo "ERROR: Docker unavailable."
            exit 1
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "ERROR: Docker access unavailable."
            exit 1
          fi

          if ! docker network inspect "${NETWORK_NAME}" >/dev/null 2>&1; then
            echo "ERROR: Network ${NETWORK_NAME} missing."
            exit 1
          fi

          if [ ! -f "${ENV_FILE}" ]; then
            echo "ERROR: Missing ${ENV_FILE}"
            exit 1
          fi

          mkdir -p "${IMAGE_DIR}"

          STAGED="/tmp/${IMAGE_NAME}-${VERSION}.tar.gz"
          IMAGE_ARCHIVE="${IMAGE_DIR}/${IMAGE_NAME}-${VERSION}.tar.gz"
          TEMP_ARCHIVE="${IMAGE_ARCHIVE}.tmp"

          if [ ! -f "${STAGED}" ]; then
            echo "ERROR: Docker image archive not found at ${STAGED}"
            exit 1
          fi

          mv "${STAGED}" "${TEMP_ARCHIVE}"
          mv "${TEMP_ARCHIVE}" "${IMAGE_ARCHIVE}"

          echo "Loading Docker image..."
          gunzip -c "${IMAGE_ARCHIVE}" | docker load

          if ! docker image inspect "${IMAGE_NAME}:${VERSION}" >/dev/null 2>&1; then
            echo "ERROR: Docker image failed verification after load."
            exit 1
          fi
          echo "Image verified: ${IMAGE_NAME}:${VERSION}"

          if docker ps -aq --filter "name=^${CONTAINER_NAME}$" | grep -q .; then
            EXISTING_IMAGE="$(docker inspect --format '{{.Config.Image}}' "${CONTAINER_NAME}")"
            case "${EXISTING_IMAGE}" in
              "${IMAGE_NAME}:"*)
                echo "Existing container image identity OK: ${EXISTING_IMAGE}"
                ;;
              *)
                echo "ERROR: Unexpected existing container image."
                echo "Expected prefix: ${IMAGE_NAME}:"
                echo "Actual: ${EXISTING_IMAGE}"
                echo "ABORT — will not replace unexpected container."
                exit 1
                ;;
            esac

            echo "Stopping ${CONTAINER_NAME}..."
            docker stop "${CONTAINER_NAME}" || true
            echo "Removing ${CONTAINER_NAME}..."
            docker rm "${CONTAINER_NAME}"
          fi

          echo "Starting ${CONTAINER_NAME}..."
          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            --network "${NETWORK_NAME}" \
            --env-file "${ENV_FILE}" \
            "${IMAGE_NAME}:${VERSION}"

          sleep 5

          if ! docker ps \
            --filter "name=^${CONTAINER_NAME}$" \
            --format '{{.Names}}' \
            | grep -Fxq "${CONTAINER_NAME}"; then
            echo "ERROR: New container failed to start."
            docker logs --tail 100 "${CONTAINER_NAME}" || true
            exit 1
          fi

          echo "New container is running."

          cd "${IMAGE_DIR}"
          ls -1t "${IMAGE_NAME}"-*.tar.gz 2>/dev/null \
            | tail -n +6 \
            | while IFS= read -r old; do
                rm -f -- "${old}"
              done

          echo "Deployment completed safely."
          docker ps --filter "name=^${CONTAINER_NAME}$"
          REMOTE_SCRIPT
